<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High Noon - مبارزة الغرب</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
    body {
      background: linear-gradient(180deg, #ff5e1a 0%, #c92a0a 55%, #1a0702 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* شمس الغروب */
    .sun {
      position: absolute;
      top: 18%;
      width: 220px;
      height: 220px;
      background: rgba(255, 220, 130, 0.35);
      border-radius: 50%;
      z-index: 0;
    }

    /* الشريط العلوي */
    .hud {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      padding: 20px;
      z-index: 2;
    }
    .stats {
      background: rgba(0, 0, 0, 0.55);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      width: 46%;
    }
    .bar-bg {
      width: 100%;
      height: 12px;
      background: #333;
      border-radius: 6px;
      margin: 6px 0;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #2ecc71;
      transition: width 0.2s;
    }
    .enemy-fill { background: #e74c3c; }
    .ammo { font-size: 14px; color: #ffd166; margin-top: 4px; }

    /* ساحة المبارزة */
    .arena {
      position: relative;
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }
    .status-banner {
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 3px 10px rgba(0,0,0,0.8);
      margin-bottom: 25px;
      text-align: center;
      min-height: 40px;
    }

    /* الشخصيات بأسلوب الظل */
    .fighters {
      width: 85%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: 180px;
      border-bottom: 6px solid #111;
      padding: 0 20px;
    }
    .cowboy {
      width: 70px;
      height: 140px;
      background: #111;
      border-radius: 30px 30px 5px 5px;
      position: relative;
      transition: transform 0.15s ease, opacity 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      color: #aaa;
    }
    /* قبعة الكاوبوي */
    .cowboy::before {
      content: "";
      position: absolute;
      top: -14px;
      width: 95px;
      height: 10px;
      background: #111;
      border-radius: 5px;
    }
    .cowboy::after {
      content: "";
      position: absolute;
      top: -28px;
      width: 50px;
      height: 18px;
      background: #111;
      border-radius: 10px 10px 0 0;
    }
    .dodging {
      transform: translateY(35px) rotate(-18deg);
      opacity: 0.7;
    }
    .enemy.dodging {
      transform: translateY(35px) rotate(18deg);
    }
    .hit-flash {
      background: #ff0000 !important;
    }

    /* أزرار التحكم */
    .controls {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      z-index: 2;
      background: rgba(0,0,0,0.75);
    }
    button {
      padding: 16px 10px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-shoot { background: #d62828; }
    .btn-dodge { background: #f77f00; }
    .btn-reload { background: #2a9d8f; }
    .btn-start {
      grid-column: span 3;
      background: #ffb703;
      color: #111;
    }
  </style>
</head>
<body>

  <div class="sun"></div>

  <div class="hud">
    <div class="stats">
      <div>أنت (البطل)</div>
      <div class="bar-bg"><div id="playerHpBar" class="bar-fill" style="width: 100%;"></div></div>
      <div id="playerAmmo" class="ammo">الطلقات: ●●●●●● (6/6)</div>
    </div>

    <div class="stats">
      <div>الخصم</div>
      <div class="bar-bg"><div id="enemyHpBar" class="bar-fill enemy-fill" style="width: 100%;"></div></div>
      <div id="enemyAmmo" class="ammo">الطلقات: ●●●●●● (6/6)</div>
    </div>
  </div>

  <div class="arena">
    <div id="banner" class="status-banner">اضغط "ابدأ المبارزة" للاستعداد!</div>
    <div class="fighters">
      <div id="playerModel" class="cowboy">أنت</div>
      <div id="enemyModel" class="cowboy enemy">الخصم</div>
    </div>
  </div>

  <div class="controls">
    <button id="shootBtn" class="btn-shoot" onclick="playerShoot()" disabled>🔥 إطلاق نار</button>
    <button id="dodgeBtn" class="btn-dodge" onclick="playerDodge()" disabled>🛡️ مراوغة</button>
    <button id="reloadBtn" class="btn-reload" onclick="playerReload()" disabled>🔄 تعبئة</button>
    <button id="startBtn" class="btn-start" onclick="startDuel()">ابدأ المبارزة</button>
  </div>

  <script>
    let player = { hp: 100, ammo: 6, dodging: false };
    let enemy = { hp: 100, ammo: 6, dodging: false };
    let canAct = false;
    let gameOver = false;
    let aiInterval = null;
    let drawTimeout = null;

    const banner = document.getElementById("banner");
    const playerHpBar = document.getElementById("playerHpBar");
    const enemyHpBar = document.getElementById("enemyHpBar");
    const playerAmmoText = document.getElementById("playerAmmo");
    const enemyAmmoText = document.getElementById("enemyAmmo");
    const playerModel = document.getElementById("playerModel");
    const enemyModel = document.getElementById("enemyModel");

    const shootBtn = document.getElementById("shootBtn");
    const dodgeBtn = document.getElementById("dodgeBtn");
    const reloadBtn = document.getElementById("reloadBtn");
    const startBtn = document.getElementById("startBtn");

    function updateUI() {
      playerHpBar.style.width = Math.max(0, player.hp) + "%";
      enemyHpBar.style.width = Math.max(0, enemy.hp) + "%";
      playerAmmoText.textContent = `الطلقات: ${"●".repeat(player.ammo)}${"○".repeat(6 - player.ammo)} (${player.ammo}/6)`;
      enemyAmmoText.textContent = `الطلقات: ${"●".repeat(enemy.ammo)}${"○".repeat(6 - enemy.ammo)} (${enemy.ammo}/6)`;
    }

    function setButtons(enabled) {
      shootBtn.disabled = !enabled;
      dodgeBtn.disabled = !enabled;
      reloadBtn.disabled = !enabled;
    }

    function startDuel() {
      clearInterval(aiInterval);
      clearTimeout(drawTimeout);

      player = { hp: 100, ammo: 6, dodging: false };
      enemy = { hp: 100, ammo: 6, dodging: false };
      canAct = false;
      gameOver = false;

      playerModel.classList.remove("dodging", "hit-flash");
      enemyModel.classList.remove("dodging", "hit-flash");
      updateUI();
      setButtons(false);
      startBtn.style.display = "none";

      banner.textContent = "استعد... لا تتحرك!";
      const waitTime = Math.floor(Math.random() * 2500) + 1500;

      drawTimeout = setTimeout(() => {
        banner.textContent = "⚡ اسحب سلاحك الآن! (DRAW) ⚡";
        canAct = true;
        setButtons(true);
        startAI();
      }, waitTime);
    }

    function flashHit(element) {
      element.classList.add("hit-flash");
      setTimeout(() => element.classList.remove("hit-flash"), 180);
    }

    function playerShoot() {
      if (!canAct || gameOver || player.dodging) return;
      if (player.ammo <= 0) {
        banner.textContent = "الذخيرة فارغة! اضغط تعبئة 🔄";
        return;
      }

      player.ammo--;
      if (enemy.dodging) {
        banner.textContent = "الخصم راوغ طلقتك!";
      } else {
        enemy.hp -= 25;
        flashHit(enemyModel);
        banner.textContent = "إصابة مباشرة في الخصم! 💥";
      }
      updateUI();
      checkWinner();
    }

    function playerDodge() {
      if (!canAct || gameOver || player.dodging) return;
      player.dodging = true;
      playerModel.classList.add("dodging");
      banner.textContent = "أنت تراوغ... 🛡️";

      setTimeout(() => {
        player.dodging = false;
        playerModel.classList.remove("dodging");
      }, 650);
    }

    function playerReload() {
      if (!canAct || gameOver || player.dodging) return;
      if (player.ammo === 6) return;
      player.ammo = 6;
      banner.textContent = "تمت تعبئة المسدس بالكامل 🔄";
      updateUI();
    }

    function startAI() {
      aiInterval = setInterval(() => {
        if (gameOver || !canAct) return;

        // قرارات الخصم
        if (enemy.ammo === 0) {
          enemy.ammo = 6;
          banner.textContent = "الخصم يعيد تعبئة سلاحه!";
          updateUI();
          return;
        }

        const action = Math.random();
        if (action < 0.6 && !enemy.dodging) {
          // الخصم يطلق النار
          enemy.ammo--;
          if (player.dodging) {
            banner.textContent = "مراوغة ناجحة! تفاديت رصاصة الخصم 🛡️";
          } else {
            player.hp -= 25;
            flashHit(playerModel);
            banner.textContent = "تلقيت إصابة من الخصم! 🩸";
          }
          updateUI();
          checkWinner();
        } else if (action >= 0.6 && action < 0.85 && !enemy.dodging) {
          // الخصم يراوغ
          enemy.dodging = true;
          enemyModel.classList.add("dodging");
          setTimeout(() => {
            enemy.dodging = false;
            enemyModel.classList.remove("dodging");
          }, 650);
        }
      }, 900);
    }

    function checkWinner() {
      if (enemy.hp <= 0) {
        endGame("🏆 فزت بالمبارزة!");
      } else if (player.hp <= 0) {
        endGame("💀 خسرت المبارزة!");
      }
    }

    function endGame(message) {
      gameOver = true;
      canAct = false;
      clearInterval(aiInterval);
      setButtons(false);
      banner.textContent = message;
      startBtn.textContent = "العب مرة ثانية";
      startBtn.style.display = "block";
    }
  </script>
</body>
</html>
